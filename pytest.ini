[pytest]
# 驗證指令慣例見 work/missions/M-001-build-operating-kit/wp/README.md §2（DR-P5）。
# 以 marker 選取各工作包驗收條件的測試：python -m pytest -m wp001_ac2
testpaths = packages/aitw/tests
pythonpath = packages/aitw/src packages/aitw/tests
addopts = --strict-markers -ra
markers =
    wp001_ac2: WP-001 AC2 刻意寫壞的 fixture 各自失敗且訊息可操作
    wp001_ac6: WP-001 AC6 JSON Schema 存在且樣板通過
    inv_i1: 不變量 I1 確定性、不呼叫模型
    inv_i2: 不變量 I2 Agent 證據最高 OBSERVED
    inv_i3: 不變量 I3 Gate 取自基底分支
    inv_i4: 不變量 I4 只認 head commit 的人類核准
    inv_i5: 不變量 I5 驗收／範圍／人類專屬路徑需人類授權
    inv_i6: 不變量 I6 證據只增不改
    inv_i7: 不變量 I7 無燒錄／儀器／設備控制指令
    inv_i8: 不變量 I8 範例與測試資料虛構
    inv_i9: 不變量 I9 數字可由檔案重算
    inv_i10: 不變量 I10 HALT 使開工與 Gate 失敗
